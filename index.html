            // V8: Road-improvement corridors use official TxDOT Roadway Inventory geometry.
            // This replaces the old straight-line sketches so the overlay follows the actual roadway.
            var feature_group_370786adb15c6d6d865f189609798696 = L.featureGroup({});
            var v8TxDOTRoadwayUrl = "https://services.arcgis.com/KTcxiTD9dsQw4r7Z/ArcGIS/rest/services/TxDOT_Roadway_Inventory/FeatureServer/0";

            var roadProjects=[];
            function v8RoadProject(opts){roadProjects.push(opts);}
            function loadRoadProject(opts){
              if(opts.loading || opts.loaded)return;
              opts.loading=true;
              var bounds=L.latLngBounds(opts.southWest,opts.northEast);
              var query=L.esri.query({url:v8TxDOTRoadwayUrl})
                .where(opts.where)
                .intersects(bounds)
                .limit(2000);

              query.run(function(err,fc){
                opts.loading=false;
                if(err || !fc || !fc.features || !fc.features.length){
                  sourceLoadErrors[opts.name]='Road geometry unavailable; toggle roads off/on to retry.';
                  updateSourceStatus();
                  return;
                }
                opts.loaded=true;
                delete sourceLoadErrors[opts.name];
                updateSourceStatus();
                var road=L.geoJSON(fc,{
                  pane:"infrastructure",
                  style:function(){
                    return {
                      color:"#ff8c00",
                      weight:4,
                      opacity:.92,
                      lineCap:"round",
                      lineJoin:"round"
                    };
                  },
                  onEachFeature:function(feature,layer){
                    layer.bindTooltip(opts.name+" — roadway reference",{sticky:true});
                    layer.bindPopup(factPopup(opts.name,[
                      ['Project',opts.description],['Limits',opts.limits],['Geometry','TxDOT roadway inventory']
                    ],'Centerlines are GIS geometry; project extents use screening bounds. Confirm current construction status at the source.',opts.source),{maxWidth:370});
                  }
                });
                road.eachLayer(function(layer){layer.addTo(feature_group_370786adb15c6d6d865f189609798696);});
              });
            }

        function v6loadOpportunities(){
          fetch('data/opportunity_metadata.json').then(function(r){if(!r.ok)throw new Error('Metadata unavailable');return r.json();}).then(function(meta){
            var date=new Date(meta.generated_at);
            if(!isNaN(date.getTime()))window.parcelSnapshotDate=date.toISOString().slice(0,10);
            window.v8OpportunityMeta=meta;
            var bits=[(meta.version||'Acquisition Mode')+' · '+window.parcelSnapshotDate];
            if(meta.priority_count!=null)bits.push(meta.priority_count+' Priority');
            if(meta.watch_count!=null)bits.push(meta.watch_count+' Watch');
            if(meta.early_speculation_count!=null)bits.push(meta.early_speculation_count+' Early');
            if(meta.highlighted_by_county){
              ['Bexar','Comal','Guadalupe'].forEach(function(k){if(Number(meta.highlighted_by_county[k]||0)>0)bits.push(meta.highlighted_by_county[k]+' '+k);});
            }
            document.getElementById('parcelDataDate').textContent=bits.join(' · ');
          }).catch(function(){document.getElementById('parcelDataDate').textContent='Opportunity snapshot date unavailable';});
          fetch("data/opportunity_parcels.geojson").then(function(r){
            if(!r.ok)throw new Error("HTTP "+r.status); return r.json();
          }).then(function(fc){
            window.v6OpportunityData=(fc.features||[]).sort(function(a,b){return Number(a.properties.rank)-Number(b.properties.rank);});
            var nodeSel=document.getElementById("v6NodeFilter"), seen={};
            window.v6OpportunityData.forEach(function(f){
              var p=f.properties||{};
              var layer=L.geoJSON(f,{style:v6style,pane:"v6ExactParcelPane",interactive:true});
              layer.bindPopup(function(){return v6popup(p);},{maxWidth:390});
              layer.bindTooltip("#"+p.rank+" · "+(p.county||"Bexar")+" · "+(p.acquisition_category||"WATCH")+" · "+p.acres+" AC · "+(p.owner||"Target parcel"),{sticky:true});
              layer.on("mouseover",function(){var s=v6style(f);s.weight=(Number(s.weight)||3)+1.5;s.fillOpacity=Math.max(Number(s.fillOpacity)||0,.20);layer.setStyle(s);});
              layer.on("mouseout",function(){layer.setStyle(v6style(f));});
              layer.addTo(window.v6OpportunityLayer);
              if(layer.bringToFront)layer.bringToFront();
              var candidateKey=String(p.candidate_id||((p.county||"Bexar")+":"+p.prop_id));
              window.v6OpportunityById[candidateKey]={feature:f,layer:layer};
              if(Number(p.rank)<=10){
                var ctr=layer.getBounds().getCenter();
                L.marker(ctr,{interactive:false,icon:L.divIcon({className:"parcel-number",html:"<div class='v6Num'>"+p.rank+"</div>",iconSize:[25,25],iconAnchor:[12,12]})}).addTo(window.v6OpportunityMarkers);
