name: Validate Bexar parcel UI

on:
  push:
    branches:
      - ui/bexar-landglide-style-20260930

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Playwright library
        run: npm install --no-save playwright@1.55.0
      - name: Require runner Chrome
        run: test -x /usr/bin/google-chrome
      - name: Core browser smoke test
        run: node tests/map-smoke.cjs
      - name: Audit live GIS endpoints
        run: python3 tests/audit-sources.py
      - name: Live GIS feature clicks
        run: TEST_STAGE=gis node tests/map-smoke.cjs
