name: Generate Acquisition Opportunities V2

on:
  push:
    branches:
      - main
    paths:
      - "scripts/generate_opportunities.py"
      - ".github/workflows/generate-opportunities.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install GIS dependencies
        run: pip install requests shapely pyproj

      - name: Validate scoring code
        run: |
          python -m py_compile scripts/generate_opportunities.py
          python - <<'PY'
          from scripts.generate_opportunities import road_importance
          assert road_importance("GERONIMO LOOP","") < 3
          assert road_importance("REEVES LOOP","") < 3
          assert road_importance("LOOP 1604","") == 3
          assert road_importance("IH 10 E ACCESS RD","") == 3
          assert road_importance("STATE HWY 211 S","") == 3
          print("Road hierarchy checks passed")
          PY

      - name: Generate Acquisition Mode V2 datasets
        run: python scripts/generate_opportunities.py

      - name: Validate generated acquisition data
        run: |
          python - <<'PY'
          import csv, json, re
          from pathlib import Path
          d=json.loads(Path("data/opportunity_parcels.geojson").read_text())
          m=json.loads(Path("data/opportunity_metadata.json").read_text())
          assert m.get("version")=="Acquisition Mode V2"
          assert d["type"]=="FeatureCollection"
          assert len(d["features"])>=5, f"Only {len(d['features'])} qualified parcels"
          excluded=re.compile(r"(HEB GROCERY|WAL.?MART|COSTCO|CITY OF|BEXAR COUNTY|COUNTY OF|SCHOOL DISTRICT|ISD|CHURCH|MINISTR|DIOCESE|BOYSVILLE|KB HOME|CONTINENTAL HOMES|DR HORTON|LENNAR|PULTE|CENTEX|MERITAGE|PERRY HOMES)",re.I)
          for f in d["features"]:
              p=f["properties"]
              assert p["acres"]>=3
              assert p["node_edge_miles"]<=1.0
              assert p["flood_confidence"]=="SCREENED"
              assert p.get("bcad_geometry_verified") is True
              assert p["acquisition_category"] in {"PRIORITY","WATCH","EARLY SPECULATION"}
              assert 0<=p["confidence_score"]<=100
              assert p.get("parcel_execution_score") is not None
              assert p.get("node_component_scores")
              assert p.get("parcel_component_scores")
              assert float(p.get("qualified_frontage_ft") or 0) >= 100, (p.get("prop_id"),p.get("qualified_frontage_ft"))
              assert int(p.get("qualified_frontage_importance") or 0) >= 3, (p.get("prop_id"),p.get("qualified_frontage_road"))
              assert str(p.get("qualified_frontage_road") or "").strip(), p.get("prop_id")
              assert not excluded.search(p.get("owner","")), p.get("owner")
              if p["acquisition_category"]=="PRIORITY":
                  assert p.get("utility_confidence")=="PROXY"
                  assert p.get("major_road_signal") is True
          rejected={"338017","338011","163835"}
          assert not any(str(f["properties"].get("prop_id")) in rejected for f in d["features"]), "Developer-rejected frontage sites reappeared"
          rows=list(csv.DictReader(open("data/tracts_to_review.csv")))
          assert len(rows)==len(d["features"])
          print("Validated",len(rows),"Acquisition V2 parcels")
          PY

      - name: Commit generated datasets
        id: commit_data
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "land-opportunity-bot"
          git config user.email "land-opportunity-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Refresh Acquisition Mode V2 datasets"
            git push origin HEAD:${{ github.ref_name }}
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish refreshed data to GitHub Pages
        if: steps.commit_data.outputs.changed == 'true' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-github-pages.yml --ref main
