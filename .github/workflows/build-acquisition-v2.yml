name: Build Acquisition Mode V2

on:
  push:
    branches:
      - acquisition/v2-node-first-20260930
    paths:
      - "scripts/generate_opportunities.py"
      - ".github/workflows/build-acquisition-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install GIS dependencies
        run: pip install requests shapely pyproj
      - name: Syntax check
        run: python -m py_compile scripts/generate_opportunities.py
      - name: Generate V2 opportunity data
        run: python scripts/generate_opportunities.py
      - name: Validate V2 data
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          d=json.load(open("data/opportunity_parcels.geojson"))
          m=json.load(open("data/opportunity_metadata.json"))
          assert m.get("version")=="Acquisition Mode V2"
          assert len(d["features"])>=5, len(d["features"])
          cats=Counter()
          for f in d["features"]:
              p=f["properties"]
              assert p["acres"]>=3
              assert p["node_edge_miles"]<=1.0
              assert p["flood_confidence"]=="SCREENED"
              assert p["acquisition_category"] in {"PRIORITY","WATCH","EARLY SPECULATION"}
              assert 0<=p["confidence_score"]<=100
              assert "parcel_execution_score" in p
              assert "node_component_scores" in p
              assert "parcel_component_scores" in p
              assert p.get("bcad_geometry_verified") is True
              cats[p["acquisition_category"]]+=1
          print("V2 highlighted:",len(d["features"]),"categories:",dict(cats))
          print("Active nodes:",m.get("active_node_count"))
          PY
      - name: Commit generated datasets
        run: |
          git config user.name "land-opportunity-bot"
          git config user.email "land-opportunity-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Generate Acquisition Mode V2 opportunity data [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
