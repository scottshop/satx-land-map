name: Inspect multicounty parcel sources

on:
  push:
    branches:
      - acquisition/v3-multicounty-20261001
    paths:
      - ".github/workflows/inspect-multicounty-sources.yml"

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Inspect parcel services
        run: |
          python - <<'PY'
          import json, urllib.request
          urls={
            "comal":"https://services7.arcgis.com/Q6vsXnxTnYcWB7qg/arcgis/rest/services/COMAL_PARCELS/FeatureServer/0",
            "guadalupe_legacy":"https://maps.pape-dawson.com/server1/rest/services/LandDevelopment/LANDDEVELOPMENT__Lennar_SiteSelection/MapServer/83",
            "nbu_live":"https://services6.arcgis.com/OCHBpyHMBFOeBqny/ArcGIS/rest/services/NBU_Parcels_live/FeatureServer/0",
            "gbra_live":"https://services6.arcgis.com/OCHBpyHMBFOeBqny/ArcGIS/rest/services/GBRA_Parcels_live/FeatureServer/0",
          }
          for name,url in urls.items():
            print("\n###",name,url)
            try:
              with urllib.request.urlopen(url+"?f=pjson",timeout=20) as r:
                d=json.load(r)
              print("name",d.get("name"),"description",d.get("description"))
              print("layers",[(x.get("id"),x.get("name")) for x in d.get("layers",[])])
              print("lastEditDate",d.get("editingInfo",{}).get("lastEditDate"),"dataLastEditDate",d.get("editingInfo",{}).get("dataLastEditDate"))
              fields=d.get("fields",[])
              if fields:
                print("fields",[(x.get("name"),x.get("alias")) for x in fields[:80]])
            except Exception as e:
              print("ERROR",repr(e))
          PY

      - name: Snap state-route node coordinates
        run: |
          pip install requests shapely pyproj
          python - <<'PY'
          import requests, math
          from shapely.geometry import shape, Point
          from shapely.ops import unary_union, nearest_points
          from pyproj import Transformer
          URL="https://services.arcgis.com/KTcxiTD9dsQw4r7Z/ArcGIS/rest/services/TxDOT_Roadways/FeatureServer/0/query"
          nodes=[
            ("Culebra / SH 211",29.524162,-98.802373,("FM",471),("SH",211)),
            ("I-10 / Loop 1604 East",29.514,-98.312,("IH",10),("LP",1604)),
            ("US 90 / SH 211",29.380,-98.800,("US",90),("SH",211)),
            ("Potranco / SH 211",29.4214,-98.7826,("FM",1957),("SH",211)),
            ("FM 1518 / I-10",29.489044,-98.223251,("FM",1518),("IH",10)),
            ("FM 1516 / I-10 East",29.514,-98.252,("FM",1516),("IH",10)),
            ("US 90 / Loop 1604 West",29.394,-98.682,("US",90),("LP",1604)),
            ("US 90 / FM 471 Castroville",29.356,-98.879,("US",90),("FM",471)),
            ("I-10 / SH 46 Seguin",29.579,-97.949,("IH",10),("SH",46)),
            ("SH 46 / FM 1863",29.750,-98.270,("SH",46),("FM",1863)),
          ]
          def key(v):
            import re
            s=str(v or "").upper().replace(" ","")
            m=re.match(r"^(IH|US|SH|FM|SL|LP)0*(\d+)",s)
            return (m.group(1),int(m.group(2))) if m else None
          project=Transformer.from_crs("EPSG:4326","EPSG:2278",always_xy=True).transform
          unproject=Transformer.from_crs("EPSG:2278","EPSG:4326",always_xy=True).transform
          from shapely.ops import transform
          for name,lat,lng,k1,k2 in nodes:
            dy=5/69; dx=5/(69*max(.25,math.cos(math.radians(lat))))
            env={"xmin":lng-dx,"ymin":lat-dy,"xmax":lng+dx,"ymax":lat+dy,"spatialReference":{"wkid":4326}}
            params={"f":"geojson","where":"1=1","geometry":__import__("json").dumps(env),"geometryType":"esriGeometryEnvelope",
                    "inSR":"4326","outSR":"4326","spatialRel":"esriSpatialRelIntersects","outFields":"RTE_NM,MAP_LBL",
                    "returnGeometry":"true","resultRecordCount":2000}
            d=requests.get(URL,params=params,timeout=30).json()
            g1=[];g2=[]
            for ft in d.get("features",[]):
              k=key((ft.get("properties") or {}).get("RTE_NM"))
              if k==k1:g1.append(shape(ft["geometry"]))
              if k==k2:g2.append(shape(ft["geometry"]))
            print("\n",name,"segments",len(g1),len(g2))
            if not g1 or not g2: continue
            a=transform(project,unary_union(g1)); b=transform(project,unary_union(g2))
            p1,p2=nearest_points(a,b)
            mid=Point((p1.x+p2.x)/2,(p1.y+p2.y)/2)
            ll=transform(unproject,mid)
            print("snap lat/lng",round(ll.y,7),round(ll.x,7),"route gap ft",round(p1.distance(p2),1))
          PY
