name: Deploy San Antonio Land Map to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published map
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ steps.deployment.outputs.page_url }}"
          echo "Checking $URL"
          for i in $(seq 1 18); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL?verify=${GITHUB_SHA}-$i" -o /tmp/pages.html; then
              if grep -q 'v8ActivateSatellite' /tmp/pages.html && grep -q 'production trigger: 2026-09-30 cleanup merge' /tmp/pages.html; then
                echo "GitHub Pages is serving the current map."
                exit 0
              fi
            fi
            sleep 5
          done
          echo "GitHub Pages did not expose the expected current-map signatures."
          exit 1
