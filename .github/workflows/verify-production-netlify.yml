name: Deploy merged main to existing Netlify site

on:
  push:
    branches:
      - verify/netlify-20260930-merge32

jobs:
  deploy-existing-site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_SITE_ID: 7e86b63c-d7f1-4377-a08a-c56aa962ccfc
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
    steps:
      - name: Check out merged production branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Require existing Netlify credential
        shell: bash
        run: |
          if [ -z "${NETLIFY_AUTH_TOKEN}" ]; then
            echo "NETLIFY_AUTH_TOKEN is not configured in repository secrets."
            exit 2
          fi

      - name: Deploy main to existing Netlify site
        shell: bash
        run: |
          npx --yes netlify-cli@23 deploy --prod --dir=. --site="${NETLIFY_SITE_ID}" --message="PR #32 cleanup reliability"

      - name: Verify merged code is live
        shell: bash
        run: |
          for i in $(seq 1 18); do
            curl -fsSL -H 'Cache-Control: no-cache' "https://satx-land-map.netlify.app/?verify=${GITHUB_SHA}-${i}" -o /tmp/site.html
            if grep -q 'v8ActivateSatellite' /tmp/site.html && grep -q 'layer-service-status' /tmp/site.html; then
              echo "Production verified at https://satx-land-map.netlify.app/"
              exit 0
            fi
            sleep 5
          done
          echo "Deploy command completed, but merged signatures are not yet visible."
          exit 1
