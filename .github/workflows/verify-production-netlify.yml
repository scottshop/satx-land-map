name: Verify current production deploy

on:
  push:
    branches:
      - verify/netlify-20260930-merge32

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Wait for existing Netlify site to publish latest main
        shell: bash
        run: |
          set -euo pipefail
          TARGET="9c8fecc1175f1de900ad7e1aa519c513247412dc"
          for i in $(seq 1 60); do
            curl -fsSL https://api.netlify.com/api/v1/sites/satx-land-map.netlify.app -o /tmp/site.json
            REF=$(python3 - <<'PY'
          import json
          d=json.load(open('/tmp/site.json'))
          print((d.get('published_deploy') or {}).get('commit_ref') or '')
          PY
            )
            echo "published commit: $REF"
            if [ "$REF" = "$TARGET" ]; then
              curl -fsSL -H 'Cache-Control: no-cache' "https://satx-land-map.netlify.app/?verify=$TARGET-$i" -o /tmp/live.html
              grep -q 'v8ActivateSatellite' /tmp/live.html
              grep -q 'production trigger: 2026-09-30 cleanup merge' /tmp/live.html
              echo "Production is current."
              exit 0
            fi
            sleep 5
          done
          echo "Netlify did not publish latest main within the verification window."
          exit 1
