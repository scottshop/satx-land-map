name: Check current Netlify production commit

on:
  push:
    branches:
      - verify/netlify-20260930-merge32

jobs:
  check-production:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Print current published Netlify commit
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://api.netlify.com/api/v1/sites/satx-land-map.netlify.app -o /tmp/site.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/site.json'))
          p=d.get('published_deploy') or {}
          print('commit_ref='+str(p.get('commit_ref')))
          print('title='+str(p.get('title')))
          print('branch='+str(p.get('branch')))
          print('published_at='+str(p.get('published_at')))
          print('updated_at='+str(p.get('updated_at')))
          PY
