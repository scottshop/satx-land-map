name: Validate layer cleanup

on:
  push:
    branches:
      - cleanup/remove-extra-layers-20260930

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install Playwright library
        run: npm install --no-save playwright@1.55.0
      - name: Require runner Chrome
        run: test -x /usr/bin/google-chrome
      - name: Browser smoke test
        run: node tests/map-smoke.cjs
