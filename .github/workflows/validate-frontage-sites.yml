name: Validate frontage-qualified acquisition sites

on:
  push:
    branches:
      - fix/acquisition-real-frontage-20261005
    paths:
      - "scripts/generate_opportunities.py"
      - ".github/workflows/validate-frontage-sites.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install GIS dependencies
        run: pip install requests shapely pyproj
      - name: Syntax check
        run: python -m py_compile scripts/generate_opportunities.py
      - name: Generate acquisition data
        run: python scripts/generate_opportunities.py
      - name: Validate frontage gate
        run: |
          python - <<'PY'
          import json,re
          d=json.load(open("data/opportunity_parcels.geojson"))
          assert d["features"], "No highlighted acquisition parcels"
          bad=[]
          for f in d["features"]:
              p=f["properties"]
              ft=float(p.get("qualified_frontage_ft") or 0)
              road=str(p.get("qualified_frontage_road") or "")
              imp=int(p.get("qualified_frontage_importance") or 0)
              if ft < 100 or imp < 3 or not road:
                  bad.append((p.get("rank"),p.get("prop_id"),ft,road,imp))
              assert "UNNAMED" not in road.upper(), (p.get("prop_id"),road)
              assert not re.search(r"\b(PVT|PRIVATE)\b",road,re.I), (p.get("prop_id"),road)
          assert not bad, bad
          old={"338017","338011","163835"}
          survivors=[f["properties"] for f in d["features"] if str(f["properties"].get("prop_id")) in old]
          for p in survivors:
              assert float(p["qualified_frontage_ft"])>=100
              assert int(p["qualified_frontage_importance"])>=3
          print("Highlighted parcels:",len(d["features"]))
          print("Top 10:")
          for f in d["features"][:10]:
              p=f["properties"]
              print(p["rank"],p["prop_id"],p["situs"],p["qualified_frontage_road"],p["qualified_frontage_ft"],p["acquisition_category"],p["parcel_opportunity_score"])
          print("Former top-3 survivors:",[(p["prop_id"],p["qualified_frontage_road"],p["qualified_frontage_ft"]) for p in survivors])
          PY
      - name: Commit regenerated data
        run: |
          git config user.name "land-opportunity-bot"
          git config user.email "land-opportunity-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Regenerate sites with 100-foot frontage gate [skip ci]"
            git push origin HEAD:${{ github.ref_name }}
          fi
